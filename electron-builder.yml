appId: com.github.haqadn.badgeprinter
productName: Badge Printer
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - LICENSE
fileAssociations:
  - ext: badge
    name: Badge Template
    role: Editor
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.productivity
  # Ad-hoc signature: without any signature, Apple Silicon Macs report downloaded apps
  # as "damaged". Ad-hoc signed apps get the milder "unidentified developer" prompt.
  # Hardened runtime would reject Electron's own pre-signed frameworks under ad-hoc signing.
  identity: '-'
  hardenedRuntime: false
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: haqadn
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE
